name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unitarios:
    name: Testes automatizados (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes do servidor
        run: python -m unittest discover -s tests
      - name: Testes da fórmula de afinidade
        run: node --test tests/test_afinidade.mjs

  roteiro:
    name: Roteiro no navegador (20 casos)
    runs-on: ubuntu-latest
    needs: unitarios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Subir o servidor em modo offline
        run: |
          nohup python server.py --offline --no-browser > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ > /dev/null && break; sleep 1; done
      - name: Executar o roteiro
        run: python tests/roteiro_e2e.py --sem-fotos
      - name: Guardar capturas e medidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roteiro-e2e
          path: |
            tests/saida
            servidor.log
